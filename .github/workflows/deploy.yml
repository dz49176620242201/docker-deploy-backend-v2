name: Deploy Application to Server

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - task-4-15-alt-grading
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/234-deploylab-backend:${{ github.ref_name == 'main' && 'latest' || 'alt' }}

      - name: Copy compose file via ssh
        if: github.event_name != 'pull_request'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST_SERVER }}
          username: ${{ secrets.HOST_USER_NAME }}
          key: ${{ secrets.HOST_SSH_PRIVATE_KEY }}
          port: 22
          source: "docker-compose.yml"
          target: "/home/ubuntu/backend-${{ github.ref_name == 'main' && 'latest' || 'alt' }}"

      - name: Docker compose
        if: github.event_name != 'pull_request'
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.HOST_SERVER }}
          username: ${{ secrets.HOST_USER_NAME }}
          key: ${{ secrets.HOST_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            IMAGE_TAG="${{ github.ref_name == 'main' && 'latest' || 'alt' }}"
            HOST_PORT="${{ github.ref_name == 'main' && '8082' || '8083' }}"
            cd "/home/ubuntu/backend-${IMAGE_TAG}"
            cat > .env <<EOF
            DOCKER_HUB_USERNAME=${{ secrets.DOCKER_HUB_USERNAME }}
            BACKEND_IMAGE_TAG=${IMAGE_TAG}
            BACKEND_HOST_PORT=${HOST_PORT}
            EOF
            echo ${{ secrets.DOCKER_HUB_TOKEN }} | sudo docker login --username ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin
            sudo docker compose -p "backend-${IMAGE_TAG}" down
            sudo docker compose -p "backend-${IMAGE_TAG}" pull
            sudo docker compose -p "backend-${IMAGE_TAG}" up -d
